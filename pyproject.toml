[project]
name = "poker-trainer"
version = "0.1.0"
description = "Texas Hold'em practice app with rule-based CPU opponents and LLM-generated play analysis"
requires-python = ">=3.12"
dependencies = [
    "pokerkit",
    "eval7",
    "streamlit",
    "anthropic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
